<script>
// ╔══════════════════════════════════════════════════════════════╗
// ║  CONFIGURACIÓN                                               ║
// ╚══════════════════════════════════════════════════════════════╝
// URL de Google Apps Script que guarda los resultados en la hoja «Resultados_Pendientes_Valores_U1_U2».
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbypDVzORWjrp0J9v7TD7Is4-JKTxaazIUMepzQuqM8VG-mzGPzDPbQOCVTk-BaypQu7Ig/exec';
const NOMBRE_EXAMEN = 'Pendientes Valores U1-U2';
// Contraseña que el profesor da al alumnado para entrar al examen (no distingue mayúsculas/minúsculas)
const EXAM_PASS = 'pendientes2027';
const TEACHER_PASS = 'VALORES2027', STORAGE_KEY = 'quiz_valores_u1u2_v1';
// Examen fijo: las mismas 60 preguntas, en el mismo orden y con las mismas opciones para todo el alumnado.
// Si algún día quieres barajar el orden de preguntas y opciones para cada alumno, pon true.
const BARAJAR = false;
// Penalización: cada ERRORES_POR_PENALIZACION errores se resta un acierto. Las respuestas en blanco no restan.
const ERRORES_POR_PENALIZACION = 3;

// EXAMEN FIJO: 60 preguntas (30 de la U1 y 30 de la U2), iguales y en el mismo orden para todo el alumnado.
// u: unidad · q: enunciado · o: 4 opciones · c: índice de la correcta (0=A,1=B,2=C,3=D) · e: explicación
const Q=[
{"u":1,"q":"La ética es:","o":["Una rama de la psicología que estudia las emociones","Una disciplina filosófica","El conjunto de leyes aprobadas por el Estado","Una ciencia experimental como la biología"],"c":1,"e":"La ética es una disciplina filosófica y uno de los pilares esenciales del comportamiento humano."},
{"u":1,"q":"Según el libro, ¿cuál es, sobre todo, la tarea del saber ético?","o":["Formar personas obedientes a las normas sociales","Enseñar a pensar como piensa la mayoría","Memorizar las teorías de los grandes filósofos","Formar personas autónomas, capaces de razonar y decidir por sí mismas el sentido de su vida"],"c":3,"e":"Además de reflexionar sobre valores, principios y normas, el saber ético debe formar personas autónomas."},
{"u":1,"q":"Sócrates, uno de los primeros filósofos morales, pensaba que la ética trata de:","o":["Cuestiones sin importancia para la vida diaria","Cómo funciona la naturaleza","Las normas de cortesía y buena educación","Cómo debemos vivir y por qué"],"c":3,"e":"Para Sócrates la ética no trata de cuestiones sin importancia, sino de cómo debemos vivir y por qué."},
{"u":1,"q":"¿Cuál de estas cualidades NO figura entre los atributos de la naturaleza humana citados en el libro?","o":["La racionalidad","La sociabilidad","La riqueza","La moralidad"],"c":2,"e":"Los atributos citados son: racionalidad, libertad, dignidad, moralidad y sociabilidad."},
{"u":1,"q":"La dignidad es:","o":["El valor intrínseco que tiene todo ser humano por el mero hecho de serlo","Un valor que se gana con esfuerzo y buenas acciones","El reconocimiento que la sociedad da a las personas importantes","Un derecho que concede cada Estado a sus ciudadanos"],"c":0,"e":"La dignidad es el valor intrínseco de todo ser humano por el mero hecho de serlo, independientemente de sus diferencias."},
{"u":1,"q":"Que la dignidad sea un valor «inalienable» significa que:","o":["Puede aumentar o disminuir según nuestras acciones","Solo lo poseen los ciudadanos de un país","Se pierde si se comete un delito","Nadie nos lo puede negar"],"c":3,"e":"Inalienable: un valor que nadie nos puede negar ni quitar."},
{"u":1,"q":"Bernabé Tierno critica a los «espíritus miopes» porque:","o":["No reflexionan sobre la felicidad","Solo aciertan a ver la dignidad en las personas más relevantes","Niegan la libertad del ser humano","No respetan el medioambiente"],"c":1,"e":"Para Bernabé Tierno, muchos solo ven la dignidad en las personas famosas o importantes, cuando todas la tienen."},
{"u":1,"q":"Según el libro, lo que convierte al ser humano en un ser moral es que:","o":["Es libre y, además, social por naturaleza","Es libre, sin más","Tiene sentimientos y emociones","Obedece las leyes de su país"],"c":0,"e":"Ser libre no basta: lo que le da la condición moral es que, además de libre, es social por naturaleza (libertad + sociabilidad = moralidad)."},
{"u":1,"q":"Si en el mundo existiera un solo ser humano, por muy libre que fuera:","o":["Sería el ser más moral de todos","Necesitaría todavía más normas","No se podría hablar de moralidad, porque sus actos no tendrían consecuencias para los demás","Su dignidad desaparecería"],"c":2,"e":"Sus actos serían totalmente indiferentes al no tener consecuencias para otros ni para el medio."},
{"u":1,"q":"La identidad personal consiste en:","o":["Los datos que aparecen en nuestro documento de identidad","Pertenecer a un grupo de amigos","Tener conciencia de quiénes somos y de cómo pensamos, sentimos y actuamos","Parecernos lo más posible a los demás"],"c":2,"e":"La identidad personal es la conciencia de quiénes somos y de cómo pensamos, sentimos y actuamos."},
{"u":1,"q":"¿Qué filósofo afirmó que cada ser humano representa algo nuevo, único y original, y que está llamado a realizar su peculiaridad?","o":["Erich Fromm","Martin Buber","Bernabé Tierno","Sócrates"],"c":1,"e":"Es una idea de Martin Buber: nunca ha existido nadie semejante a cada uno de nosotros."},
{"u":1,"q":"¿En qué etapa se consolida la identidad personal?","o":["En la etapa adulta, cuando reconocemos el lugar que ocupamos en la sociedad","En la infancia","En la adolescencia","En la vejez"],"c":0,"e":"La identidad se consolida en la etapa adulta, cuando reconocemos nuestro lugar en la sociedad."},
{"u":1,"q":"Sobre la identidad personal, es correcto afirmar que:","o":["Es algo fijo que no cambia a lo largo de la vida","Se hereda de los padres","No es algo fijo: cambia con nuestras experiencias, aprendizajes, relaciones, ideas y creencias","Deja de cambiar al terminar la adolescencia"],"c":2,"e":"La vida nos demuestra que la identidad no es fija, sino que va cambiando."},
{"u":1,"q":"La educación emocional consiste en aprender a:","o":["Reprimir las emociones para que no nos afecten","Ocultar nuestros sentimientos a los demás","Identificar, expresar y gestionar nuestros sentimientos y emociones de forma adecuada","Suprimir las emociones negativas"],"c":2,"e":"No se trata de reprimirlas o suprimirlas, sino de manejarlas de manera inteligente."},
{"u":1,"q":"Respecto a las emociones, el libro afirma que:","o":["No hay emociones buenas o malas: todas tienen un propósito","Las emociones negativas deben eliminarse","Solo la alegría tiene alguna utilidad","La ira es siempre una emoción mala"],"c":0,"e":"No hay emociones buenas o malas, aunque algunas nos parezcan más deseables que otras."},
{"u":1,"q":"¿Qué función cumple la ira?","o":["No cumple ninguna función","Nos ayuda a relajarnos","Nos hace más empáticos","Nos activa psicológica y físicamente cuando presenciamos una injusticia"],"c":3,"e":"La ira es poco atractiva, pero necesaria: nos activa ante una injusticia."},
{"u":1,"q":"¿Cuándo se convierte la ira en un problema?","o":["Siempre que aparece","Cuando no tiene un motivo justificado o, siendo justificada, es desproporcionada","Cuando surge ante una injusticia","Nunca, porque no hay emociones malas"],"c":1,"e":"En esos casos suele traducirse en comportamientos agresivos."},
{"u":1,"q":"La autoestima es:","o":["La opinión que los demás tienen de nosotros","Un rasgo físico que se hereda","La autovaloración de nuestras cualidades y de nuestra capacidad para afrontar retos y conseguir objetivos","El éxito que alcanzamos en las redes sociales"],"c":2,"e":"La autoestima es la autovaloración de nuestras cualidades, forma de ser y capacidad para afrontar retos."},
{"u":1,"q":"Sobre la autoestima, es correcto afirmar que:","o":["Es heredada y permanente","No cambia después de la infancia","Depende solo de nuestro aspecto físico","No es heredada ni permanente: evoluciona a lo largo de la vida"],"c":3,"e":"No es heredada: la desarrollamos. Y no es permanente: evoluciona en las distintas etapas de la vida."},
{"u":1,"q":"Las personas con exceso de autoestima se caracterizan por ser:","o":["Inseguras y tímidas","Egoístas, intolerantes, narcisistas y creerse omnipotentes","Humildes y dependientes de los demás","Culpabilizarse de todo"],"c":1,"e":"Además se creen independientes de quienes les rodean, lo que puede llevarles a conductas temerarias."},
{"u":1,"q":"Las personas con autoestima baja:","o":["Se creen omnipotentes","Practican conductas temerarias","Son inseguras, se culpabilizan por todo y no se atreven a afrontar nuevos retos","Confían plenamente en sus capacidades"],"c":2,"e":"En sus relaciones se comportan de forma tímida e incluso agresiva, y pueden sufrir aislamiento, ansiedad o depresión."},
{"u":1,"q":"¿Cuál de estas NO es una pauta para mejorar la autoestima?","o":["Considerar los errores como oportunidades para aprender","Realizar ejercicio físico","Valorar las propias opiniones e ideas y no tener miedo a expresarlas","Ponerse como objetivo la perfección en todo"],"c":3,"e":"El libro aconseja ponerse como objetivo el logro de las metas, en vez de la perfección."},
{"u":1,"q":"La igualdad y el respeto mutuo en las relaciones afectivas nos permiten considerar a las demás personas:","o":["Como fines y no como meros medios","Como medios para conseguir nuestros fines","Como inferiores si no piensan como nosotros","Como competidoras"],"c":0,"e":"Nos permiten reconocer, aceptar y valorar al otro, tratarlo como igual y considerarlo un fin, no un medio."},

function gR(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch{return[]}}
function sR(e){try{const r=gR();r.push(e);localStorage.setItem(STORAGE_KEY,JSON.stringify(r))}catch{}}

let stu={name:'',email:'',curso:''},qs=[],cur=0,ok=0,ko=0,bl=0,lg=[];
const ct=document.getElementById('content');
function sh(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}

function buildExam(){
  if(!BARAJAR)return Q.map(q=>({...q}));
  return sh(Q).map(q=>{const idx=sh([0,1,2,3]);return{u:q.u,q:q.q,e:q.e,o:idx.map(i=>q.o[i]),c:idx.indexOf(q.c)}});
}
function totalPreg(){return Q.length}

function showLogin(m){m=m||'alumno';
const rules=m==='alumno'?`<div class="rules"><strong>Normas del examen</strong><ul><li>${totalPreg()} preguntas: ${Q.filter(q=>q.u===1).length} de la Unidad 1 y ${Q.filter(q=>q.u===2).length} de la Unidad 2.</li><li>Cada pregunta tiene <b>4 opciones</b> y solo <b>una</b> es correcta.</li><li><b>Cada 3 respuestas erróneas se resta 1 acierto.</b></li><li>Si no estás seguro/a, puedes <b>dejar la pregunta en blanco</b>: no resta.</li><li>Una vez respondida, no se puede cambiar la respuesta.</li><li>No verás si aciertas o fallas hasta <b>terminar el examen</b>.</li></ul></div>`:'';
ct.innerHTML=`<div class="login-screen"><h2>${m==='alumno'?'Identificación del alumno/a':'Acceso del profesor'}</h2><p>${m==='alumno'?'Introduce tus datos para comenzar.':'Introduce la contraseña.'}</p>${rules}<div class="login-box"><div class="login-toggle"><button class="toggle-btn ${m==='alumno'?'active':''}" onclick="showLogin('alumno')">Alumno/a</button><button class="toggle-btn ${m==='profesor'?'active':''}" onclick="showLogin('profesor')">Profesor</button></div><div id="lf">${m==='alumno'?sF():tF()}</div></div></div>`;const f=document.querySelector('#lf input');if(f)setTimeout(()=>f.focus(),80)}

function sF(){return`<div class="field"><label>Nombre completo</label><input type="text" id="in" placeholder="Ej: María López García"><div class="error-msg" id="en">Introduce tu nombre</div></div><div class="field"><label>Correo corporativo</label><input type="email" id="ie" placeholder="tucorreo@murciaeduca.es"><div class="hint">@murciaeduca.es · @alu.murciaeduca.es · @alu365.murciaeduca.es</div><div class="error-msg" id="ee">Correo no válido</div></div><div class="field"><label>Curso actual</label><select id="ic"><option value="">— Selecciona —</option><option>3º ESO</option><option>4º ESO</option><option>1º Bachillerato</option></select><div class="error-msg" id="ec">Selecciona curso</div></div><div class="field"><label>Contraseña del examen</label><input type="password" id="ix" placeholder="La que te dé el profesor"><div class="error-msg" id="ex">Contraseña incorrecta</div></div><button class="login-btn" onclick="doSL()">Comenzar el examen →</button>`}
function tF(){return`<div class="field"><label>Contraseña</label><input type="password" id="ip" placeholder="Contraseña"><div class="error-msg" id="ep">Incorrecta</div></div><button class="login-btn" onclick="doTL()">Acceder →</button>`}

function doSL(){const n=document.getElementById('in').value.trim(),e=document.getElementById('ie').value.trim().toLowerCase(),c=document.getElementById('ic').value;let v=1;
if(!n||n.length<3){document.getElementById('en').style.display='block';v=0}else document.getElementById('en').style.display='none';
if(!/^[^\s@]+@(alu365\.|alu\.)?murciaeduca\.es$/.test(e)){document.getElementById('ee').style.display='block';v=0}else document.getElementById('ee').style.display='none';
if(!c){document.getElementById('ec').style.display='block';v=0}else document.getElementById('ec').style.display='none';
if(document.getElementById('ix').value.trim().toLowerCase()!==EXAM_PASS.toLowerCase()){document.getElementById('ex').style.display='block';v=0}else document.getElementById('ex').style.display='none';
if(!v)return;stu={name:n,email:e,curso:c};qs=buildExam();cur=0;ok=0;ko=0;bl=0;lg=[];showQ()}

function doTL(){document.getElementById('ip').value.trim().toLowerCase()===TEACHER_PASS.toLowerCase()?showTP():document.getElementById('ep').style.display='block'}

function net(){return Math.max(0,ok-Math.floor(ko/ERRORES_POR_PENALIZACION))}

function showQ(){
if(cur>=qs.length){finish();return}const q=qs[cur],pct=(cur/qs.length*100).toFixed(0);
const bd=`<div class="options">${q.o.map((o,i)=>`<button class="option-btn" onclick="aT(${i})"><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div><button class="blank-btn" id="bb" onclick="aT(-1)">Dejar en blanco (no resta)</button>`;
ct.innerHTML=`<div class="student-tag"><span class="dot"></span>${esc(stu.name)} · ${esc(stu.curso)}</div><div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div><div class="progress-info"><span>Pregunta ${cur+1}/${qs.length}</span><span>Respondidas: ${ok+ko} · En blanco: ${bl}</span></div><div class="question-card"><span class="q-type u${q.u}">Unidad ${q.u}</span><div class="q-text">${esc(q.q)}</div>${bd}<div id="fb"></div><button class="next-btn" id="nb" onclick="nQ()">Siguiente →</button></div>`}

function aT(i){const q=qs[cur],bs=document.querySelectorAll('.option-btn');bs.forEach(b=>{b.classList.add('disabled');b.onclick=null});document.getElementById('bb').style.display='none';
let st;if(i<0){bl++;st='blank'}else{bs[i].classList.add('selected');if(i===q.c){ok++;st='ok'}else{ko++;st='ko'}}
lg.push({n:Q.findIndex(z=>z.q===q.q)+1,l:i<0?'':'ABCD'[i],xl:'ABCD'[q.c],q:q.q,u:q.u,st,g:i<0?'En blanco':q.o[i],x:q.o[q.c],e:q.e});
// La corrección no se muestra hasta el final del examen
document.getElementById('fb').innerHTML=`<div class="feedback fb-blank"><strong>${st==='blank'?'Pregunta dejada en blanco':'Respuesta registrada'}</strong>Verás la corrección al terminar el examen.</div>`;document.getElementById('nb').style.display='block'}
function nQ(){cur++;showQ()}

// Respuestas del alumno para la columna M (por si hay reclamaciones). Formato: P1: B ✓ | P2: A ✗ (correcta: C) | P3: en blanco
function respTxt(){return lg.slice().sort((a,b)=>a.n-b.n).map(r=>r.st==='blank'?`P${r.n}: en blanco`:r.st==='ok'?`P${r.n}: ${r.l} ✓`:`P${r.n}: ${r.l} ✗ (correcta: ${r.xl})`).join(' | ')}
async function sendGS(entry){
if(!APPS_SCRIPT_URL||APPS_SCRIPT_URL.includes('PEGA_AQUI'))return'no-url';
try{await fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({fecha:entry.date,nombre:entry.name,curso:entry.curso,correo:entry.email,nota:entry.nota,aciertos:entry.ok,total:entry.tp,porcentaje:entry.pct,errores:entry.ko,blanco:entry.bl,netos:entry.net,examen:NOMBRE_EXAMEN,respuestas:respTxt()})});return'ok'}catch{return'error'}}

async function finish(){
const tp=qs.length,n=net(),nota=(n/tp*10).toFixed(2),pct=Math.round(n/tp*100),pen=Math.floor(ko/ERRORES_POR_PENALIZACION),now=new Date(),ds=now.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const entry={name:stu.name,email:stu.email,curso:stu.curso,ok,ko,bl,net:n,tp,pct,nota:parseFloat(nota),date:ds};sR(entry);
let gc='',gr='';const nv=parseFloat(nota);if(nv>=9){gc='var(--correct)';gr='Sobresaliente'}else if(nv>=7){gc='var(--gen1)';gr='Notable'}else if(nv>=6){gc='var(--gen1)';gr='Bien'}else if(nv>=5){gc='var(--gen5)';gr='Suficiente'}else{gc='var(--wrong)';gr='Insuficiente'}
// Al alumno solo se le muestra la nota (sin revisión de respuestas)
ct.innerHTML=`<div class="results"><div class="student-tag"><span class="dot"></span>${esc(stu.name)} · ${esc(stu.curso)}</div><h2>Examen terminado</h2><div class="score-circle" style="border-color:${gc}"><span class="big" style="color:${gc}">${nota.replace('.',',')}</span><span class="label">nota sobre 10</span></div><p style="font-size:1.15rem;font-weight:700;color:${gc}">${gr}</p><div id="ss" class="sync-status sync-pending">⏳ Enviando resultados...</div></div>`;
const r=await sendGS(entry);const ss=document.getElementById('ss');
if(r==='ok'){ss.className='sync-status sync-ok';ss.textContent='✓ Resultados enviados al profesor'}
else if(r==='no-url'){ss.className='sync-status sync-pending';ss.textContent='ℹ Guardado local (Google Sheets no configurado)'}
else{ss.className='sync-status sync-fail';ss.textContent='⚠ Error de envío. Guardado localmente.'}}

function showTP(){
const res=gR().sort((a,b)=>b.nota-a.nota||a.name.localeCompare(b.name));
let rows='';res.forEach((r,i)=>{let pc='';if(i===0)pc='rank-gold';else if(i===1)pc='rank-silver';else if(i===2)pc='rank-bronze';
rows+=`<tr><td class="rank-pos ${pc}">${i+1}</td><td><strong>${esc(r.name)}</strong></td><td>${esc(r.curso)}</td><td>${esc(r.email)}</td><td class="rank-score">${r.nota}/10</td><td>${r.ok}</td><td>${r.ko}</td><td>${r.bl}</td><td>${r.net}/${r.tp}</td><td>${r.date}</td></tr>`});
if(!res.length)rows=`<tr><td colspan="10" style="text-align:center;padding:2rem;color:var(--text-muted)">Sin resultados locales.<br>Los centralizados están en Google Sheets.</td></tr>`;
ct.innerHTML=`<div class="ranking-section"><h3>Panel del profesor</h3><p style="text-align:center;font-size:.85rem;color:var(--text-muted);margin-bottom:1rem">Examen de ${Q.length} preguntas (${Q.filter(q=>q.u===1).length} de la U1 y ${Q.filter(q=>q.u===2).length} de la U2). Datos locales de este dispositivo; los centralizados están en tu <strong>Google Sheets</strong>.</p><div class="ranking-table-wrap"><table class="ranking-table"><thead><tr><th>#</th><th>Alumno/a</th><th>Curso</th><th>Correo</th><th>Nota</th><th>Aciertos</th><th>Errores</th><th>Blanco</th><th>Netos</th><th>Fecha</th></tr></thead><tbody>${rows}</tbody></table></div>${res.length?`<div style="text-align:center"><button class="excel-btn" onclick="dlXL()">📊 Descargar Excel</button><button class="excel-btn" onclick="if(confirm('¿Borrar datos locales?')){try{localStorage.removeItem(STORAGE_KEY)}catch{};showTP()}" style="border-color:var(--wrong);color:var(--wrong);margin-left:.5rem">Borrar datos</button></div>`:''}<div style="text-align:center;margin-top:1rem"><button class="restart-btn" onclick="showLogin('alumno')">← Volver</button></div></div>`}

function dlXL(){
const res=gR().sort((a,b)=>b.nota-a.nota);
const d=[['RESULTADOS · EXAMEN PENDIENTES VALORES CÍVICOS Y ÉTICOS (U1-U2) — IES Alquipir'],[''],['#','Alumno/a','Curso','Correo','Nota','Aciertos','Errores','En blanco','Netos','Total','Fecha']];
res.forEach((r,i)=>d.push([i+1,r.name,r.curso,r.email,r.nota,r.ok,r.ko,r.bl,r.net,r.tp,r.date]));
const wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(d);
