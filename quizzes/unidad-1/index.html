*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}.app{max-width:800px;margin:0 auto;padding:1.5rem 1rem 3rem}.header{text-align:center;padding:2rem 0 1.5rem}.header h1{font-family:'DM Serif Display',serif;font-size:clamp(1.6rem,4vw,2.4rem);margin-bottom:.3rem}.header p{color:var(--text-muted);font-size:.9rem;font-weight:300}
.login-screen{max-width:460px;margin:0 auto;text-align:center}.login-screen h2{font-family:'DM Serif Display',serif;font-size:1.6rem;margin-bottom:.5rem}.login-screen>p{color:var(--text-muted);font-size:.9rem;margin-bottom:1.5rem}.login-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2rem 1.8rem;text-align:left;box-shadow:var(--shadow)}.login-toggle{display:flex;border-radius:10px;background:var(--surface2);padding:4px;margin-bottom:1.5rem;gap:4px}.toggle-btn{flex:1;padding:.6rem;border:none;border-radius:8px;font-family:'Nunito',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer;background:transparent;color:var(--text-muted);transition:all .2s}.toggle-btn.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.field{margin-bottom:1.1rem}.field label{display:block;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-bottom:.35rem}.field input,.field select{width:100%;padding:.75rem 1rem;background:var(--surface2);border:2px solid transparent;border-radius:10px;color:var(--text);font-family:'Nunito',sans-serif;font-size:.95rem;transition:border-color .2s}.field input:focus,.field select:focus{outline:none;border-color:var(--accent)}.field input::placeholder{color:var(--text-muted);opacity:.5}.field .hint{font-size:.73rem;color:var(--text-muted);margin-top:.25rem}.field .error-msg{font-size:.8rem;color:var(--wrong);margin-top:.25rem;display:none}
.login-btn{width:100%;padding:.85rem;border:none;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:800;cursor:pointer;transition:opacity .2s;margin-top:.3rem}.login-btn:hover{opacity:.9}

.results{text-align:center;animation:fadeIn .5s ease}.results h2{font-family:'DM Serif Display',serif;font-size:1.8rem;margin-bottom:.5rem}.score-circle{width:150px;height:150px;border-radius:50%;margin:1.2rem auto;display:flex;flex-direction:column;align-items:center;justify-content:center;border:4px solid var(--correct);background:var(--surface)}.score-circle .big{font-family:'DM Serif Display',serif;font-size:2.8rem;line-height:1}.score-circle .label{font-size:.75rem;color:var(--text-muted)}.results-details{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:1.2rem 0}.result-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.8rem;box-shadow:var(--shadow)}.result-stat .num{font-family:'DM Serif Display',serif;font-size:1.6rem}.result-stat .lbl{font-size:.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}
.restart-btn{margin-top:1.2rem;padding:.7rem 2rem;border:2px solid var(--border);border-radius:10px;background:transparent;color:var(--text-muted);font-family:'Nunito',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s}.restart-btn:hover{border-color:var(--accent);color:var(--accent)}
.sync-status{margin-top:.8rem;padding:.6rem 1rem;border-radius:8px;font-size:.82rem;font-weight:600;display:inline-block}.sync-ok{background:var(--correct-bg);color:var(--correct)}.sync-fail{background:var(--wrong-bg);color:var(--wrong)}.sync-pending{background:var(--gen5-bg);color:var(--gen5)}
.ranking-section{margin-top:2rem;text-align:left;animation:fadeIn .4s ease}.ranking-section h3{font-family:'DM Serif Display',serif;font-size:1.3rem;margin-bottom:.8rem;text-align:center}.ranking-table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}.ranking-table{width:100%;border-collapse:collapse;font-size:.88rem}.ranking-table th{background:var(--surface2);padding:.7rem .8rem;text-align:left;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);border-bottom:2px solid var(--border)}.ranking-table td{padding:.65rem .8rem;border-bottom:1px solid var(--surface2)}.ranking-table tr:last-child td{border-bottom:none}.ranking-table .rank-pos{font-weight:800;color:var(--accent2);width:30px;text-align:center}.ranking-table .rank-score{font-weight:700}.rank-gold{color:#B7791F}.rank-silver{color:#718096}.rank-bronze{color:#C05621}
.excel-btn{display:inline-flex;align-items:center;gap:.5rem;margin-top:1rem;padding:.75rem 1.5rem;border:2px solid var(--correct);border-radius:10px;background:transparent;color:var(--correct);font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .2s}.excel-btn:hover{background:var(--correct);color:#fff}
.review-section{margin-top:1.5rem;text-align:left}.review-section h3{font-family:'DM Serif Display',serif;font-size:1.2rem;margin-bottom:.8rem;text-align:center}.review-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.85rem 1rem;margin-bottom:.5rem;border-left:3px solid var(--text-muted)}.review-item.rev-correct{border-left-color:var(--correct)}.review-item.rev-wrong{border-left-color:var(--wrong)}.review-item .rev-q{font-weight:700;font-size:.85rem;margin-bottom:.3rem}.review-item .rev-detail{font-size:.8rem;color:var(--text-muted);line-height:1.4}.review-item .rev-detail span.ok{color:var(--correct);font-weight:600}.review-item .rev-detail span.ko{color:var(--wrong);font-weight:600}

@media(max-width:500px){.question-card{padding:1.3rem 1rem}.login-box{padding:1.5rem 1.2rem}.classify-item{flex-direction:column;align-items:flex-start}.classify-item select{width:100%}.ranking-table{font-size:.8rem}}

.q-type.test{background:var(--gen1-bg);color:var(--gen1)}
.option-btn.selected{border-color:var(--accent2);background:rgba(212,165,116,.15)}.option-btn.selected .letter{background:var(--accent2);color:#fff}
.nav-row{display:flex;gap:.6rem;margin-top:1.2rem}.nav-row button{flex:1;margin-top:0}
.blank-btn{padding:.85rem;border:2px solid var(--border);border-radius:10px;background:transparent;color:var(--text-muted);font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer}.blank-btn:hover{border-color:var(--text-muted)}
.go-btn{padding:.85rem;border:none;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer}.go-btn:disabled{opacity:.4;cursor:default}
.rules{background:var(--surface2);border-radius:10px;padding:.9rem 1rem;font-size:.82rem;color:var(--text-muted);margin-bottom:1.2rem;line-height:1.5}.rules strong{color:var(--text)}

const STORAGE_KEY = 'examen_valores_u1_v4', DONE_KEY = 'examen_valores_u1_hechos_v4';
// Penalización: cada 3 respuestas erróneas restan 1 acierto. Las preguntas en blanco no restan.
const ERRORES_POR_PENALIZACION = 3;

const Q=[{"b": "1.1 ¿Qué es la ética?", "q": "La ética es una rama de la filosofía que…", "o": ["estudia los principios y normas que guían el comportamiento humano y qué es correcto o incorrecto", "recoge las leyes que aprueba cada Estado y las sanciones que corresponden a quien las incumple", "describe las costumbres de cada pueblo sin valorar si son buenas o malas para sus miembros", "analiza el funcionamiento del cerebro humano cuando toma decisiones en situaciones de peligro"], "c": 0}, {"b": "1.1 ¿Qué es la ética?", "q": "¿De dónde proceden las palabras «ética» y «moral»?", "o": ["Ética, del latín «mos» (costumbre); moral, del griego «ethos» (carácter o forma de vivir)", "Las dos proceden del latín y significan exactamente lo mismo: «ley» o «norma»", "Las dos proceden del griego y significan «virtud» y «felicidad» respectivamente", "Ética, del griego «ethos» (carácter); moral, del latín «mos» (costumbres)"], "c": 3}, {"b": "1.1 ¿Qué es la ética?", "q": "¿Cuál es la diferencia clave entre moral y ética?", "o": ["No hay ninguna diferencia: son dos palabras para lo mismo", "La moral es individual y la ética es siempre colectiva", "La moral es la reflexión filosófica y la ética son las normas concretas de una comunidad", "La moral son las normas de una comunidad; la ética, la reflexión filosófica sobre ellas"], "c": 3}, {"b": "1.1 Preguntas de la ética", "q": "Al preguntarse qué es el bien, la ética distingue entre teorías deontológicas y consecuencialistas. ¿En qué se basa cada una?", "o": ["Las deontológicas, en la religión; las consecuencialistas, en las leyes", "Las deontológicas, en los resultados; las consecuencialistas, en los deberes", "Las deontológicas, en los deberes; las consecuencialistas, en los resultados", "Las dos se basan en lo que decide la mayoría de la sociedad"], "c": 2}, {"b": "1.1 Preguntas de la ética", "q": "La pregunta «¿son universales los principios morales?» es clave en el debate entre…", "o": ["la libertad y la seguridad", "la ética secular (laica) y la ética religiosa", "el relativismo moral y el universalismo ético", "la justicia y la compasión"], "c": 2}, {"b": "1.2 Harari", "q": "¿Qué riesgo ético señala Harari si la edición genética (CRISPR) se usa para mejorar la inteligencia o la apariencia?", "o": ["Que desaparezcan enfermedades como la fibrosis quística o la distrofia muscular", "Que se cree una «clase superior» biológicamente mejorada y aumente la desigualdad", "Que la tecnología deje de funcionar por falta de inversión pública", "Que los embriones modificados no puedan tener descendencia en el futuro"], "c": 1}, {"b": "1.2 Harari", "q": "Para paliar los efectos de la automatización sobre el empleo, Harari ha sugerido…", "o": ["la renta básica universal", "prohibir el uso de robots en las empresas", "volver a los oficios tradicionales sin tecnología", "reducir los salarios de quienes conservan su trabajo"], "c": 0}, {"b": "1.2 Harari", "q": "Frente al cambio climático, ¿qué considera Harari que es clave?", "o": ["La cooperación global y una tecnología al servicio de la sostenibilidad", "Que los países en desarrollo asuman la mayor parte del esfuerzo necesario", "Que cada país resuelva el problema por su cuenta, sin depender de los demás", "Frenar por completo el desarrollo tecnológico en todos los países del mundo"], "c": 0}, {"b": "1.2 Bauman", "q": "¿Qué quiere decir Zygmunt Bauman con la expresión «modernidad líquida»?", "o": ["Que la sociedad actual se basa en el comercio del agua y otros recursos naturales", "Que las estructuras sociales y morales se han vuelto fluidas e inestables", "Que las tradiciones de siempre se mantienen firmes pese a los cambios", "Que la tecnología ha resuelto la mayoría de los problemas sociales"], "c": 1}, {"b": "1.2 Bauman", "q": "En la modernidad líquida, ¿qué consecuencia tiene el consumo como eje de la vida social?", "o": ["Que las personas dejen de construir su identidad a través de lo que compran", "Una constante insatisfacción, porque lo que se posee nunca es suficiente", "La desaparición de las modas y de las tendencias pasajeras", "Una mayor estabilidad laboral y económica para la mayoría de las personas"], "c": 1}, {"b": "1.2 Beck", "q": "En la teoría de la «sociedad del riesgo» de Ulrich Beck, los riesgos globales como el colapso ecológico…", "o": ["solo afectan a los países pobres, que no pueden protegerse", "pueden resolverse con medidas tomadas por cada país de forma separada", "son consecuencia directa del desarrollo industrial y exigen una ética global", "son accidentes aislados e imprevisibles que no tienen relación entre sí"], "c": 2}, {"b": "1.2 Sostenibilidad", "q": "La sostenibilidad consiste en…", "o": ["satisfacer las necesidades presentes sin comprometer las de las futuras generaciones", "consumir más productos para mantener el empleo y la producción", "crecer económicamente lo más rápido posible, aunque se agoten los recursos", "conservar la naturaleza prohibiendo cualquier actividad económica"], "c": 0}, {"b": "1.3 La convivencia social", "q": "De los valores necesarios para la convivencia, ¿cuál es la habilidad de ponerse en el lugar del otro y comprender sus emociones?", "o": ["La tolerancia", "La empatía", "La solidaridad", "La justicia"], "c": 1}, {"b": "1.4 Autonomía moral", "q": "¿Cuándo se alcanza la autonomía moral?", "o": ["Cuando se hace lo que decide la mayoría para no quedar excluido", "Cuando se reflexiona críticamente sobre los valores aprendidos y se eligen de forma consciente", "Cuando se obedece a la autoridad para evitar un castigo o conseguir un premio", "Cuando se aceptan sin discusión las normas heredadas de la familia y de la cultura"], "c": 1}, {"b": "1.4 Pensamiento crítico", "q": "Los prejuicios sociales son…", "o": ["creencias preconcebidas e irracionales que discriminan a ciertos grupos", "conocimientos científicos que se transmiten de generación en generación", "opiniones razonadas que se basan en la experiencia personal de cada individuo", "normas morales que todas las culturas del mundo comparten por igual"], "c": 0}, {"b": "IA y ética", "q": "¿Por qué un sistema de inteligencia artificial puede perpetuar injusticias, como en el reconocimiento facial o en la selección de personal?", "o": ["Porque los programadores no pueden modificar nunca un algoritmo", "Porque las máquinas tienen intención propia de discriminar a las personas", "Porque se entrena con datos que contienen sesgos y los reproduce o amplifica", "Porque la IA solo funciona correctamente con personas adultas"], "c": 2}, {"b": "IA y ética", "q": "¿Qué es la brecha digital?", "o": ["El tiempo que tarda una tecnología nueva en quedar anticuada", "La desigualdad en el acceso, uso y aprovechamiento de las tecnologías de la información", "Un fallo de seguridad que permite a los ciberdelincuentes robar datos", "La distancia entre lo que una persona publica en redes y cómo es en realidad"], "c": 1}, {"b": "2. Naturaleza humana y moralidad", "q": "¿Qué convierte al ser humano en un ser moral, además de ser libre?", "o": ["Ser emocional por naturaleza", "Ser racional por naturaleza", "Ser social por naturaleza", "Ser religioso por naturaleza"], "c": 2}, {"b": "2.1 Los instintos", "q": "La reacción de «lucha o huida» (fight or flight) ante una amenaza es una manifestación del instinto…", "o": ["de cooperación", "de reproducción", "social", "de supervivencia"], "c": 3}, {"b": "2.1 Los instintos", "q": "Ante el dilema de los supervivientes de «Viven», ¿qué posturas contrapone el tema?", "o": ["Hobbes y Kant coinciden en que comer carne humana es aceptable si se trata de sobrevivir", "Hobbes: en situaciones extremas la supervivencia lo justifica todo; Kant: la moral no se viola nunca", "Hobbes y Kant coinciden en que la moral depende solo de lo que decida el consenso del grupo", "Hobbes: los principios morales son absolutos y no admiten excepciones; Kant: la supervivencia es el valor primordial"], "c": 1}, {"b": "2.2 Cuida tu alma", "q": "Para Sócrates, ¿por qué hace alguien el mal?", "o": ["Por maldad deliberada, sabiendo perfectamente que está mal", "Por culpa de su cuerpo, que es temporal y está sujeto a la decadencia", "Por falta de riquezas, que son lo que hace buena a una persona", "Por ignorancia, porque nadie hace el mal deliberadamente"], "c": 3}, {"b": "2.2 Cuida tu alma", "q": "¿Qué es la areté para Sócrates?", "o": ["El cuidado del cuerpo mediante la gimnasia y la dieta", "La riqueza necesaria para vivir sin preocupaciones materiales", "La virtud: la excelencia moral y el estado ideal del alma", "El éxito social y la fama que se consiguen con el esfuerzo"], "c": 2}, {"b": "3. La identidad personal", "q": "¿Cómo evoluciona la identidad personal?", "o": ["Cambia con nuestras experiencias, relaciones e ideas", "Queda fijada en la infancia y ya no cambia nunca más", "Se forma de golpe en la adolescencia y permanece igual", "Depende solo de la herencia genética que recibimos"], "c": 0}, {"b": "4. Educación emocional", "q": "¿Hay emociones buenas y emociones malas?", "o": ["Sí: las buenas hay que expresarlas y las malas hay que reprimirlas", "No: las emociones no influyen en nuestra conducta ni en nuestras relaciones", "Sí: la alegría es buena y el enfado o la tristeza son siempre malos", "No: todas tienen un propósito, como sobrevivir, dirigir la conducta y relacionarnos"], "c": 3}, {"b": "4. Educación emocional", "q": "¿Cuándo se convierte la ira en un problema?", "o": ["Solo cuando la sentimos ante una injusticia que presenciamos", "Únicamente cuando la sienten las personas adultas en situaciones de estrés", "Siempre, porque la ira es una emoción negativa que hay que eliminar", "Cuando surge sin motivo justificado o, siendo justificada, es desproporcionada"], "c": 3}, {"b": "5. La autoestima", "q": "¿Cómo se forma la autoestima?", "o": ["Valorando nuestro comportamiento e interiorizando la opinión de los demás", "Depende solo de los éxitos académicos y deportivos que consigamos", "Se hereda de los padres, igual que el color de los ojos o del pelo", "Viene dada desde el nacimiento y no podemos modificarla"], "c": 0}, {"b": "5. La autoestima", "q": "Las personas con exceso de autoestima se caracterizan por ser…", "o": ["inseguras, tímidas y con miedo a afrontar cualquier reto nuevo", "equilibradas, abiertas y con confianza razonable en sí mismas", "humildes, generosas y muy dependientes de quienes las rodean", "egoístas, intolerantes, narcisistas y con conductas temerarias"], "c": 3}, {"b": "6. Relaciones afectivas", "q": "Las relaciones afectivas que se basan en la dominación y el control, en lugar de en la igualdad y el respeto mutuo, suelen derivar en…", "o": ["una mayor confianza y comunicación entre ambas partes", "la desaparición progresiva de cualquier conflicto en la pareja", "relaciones más estables y duraderas que las basadas en la igualdad", "maltrato físico y psicológico, como en la violencia de género"], "c": 3}, {"b": "7. Educación afectivo-sexual", "q": "¿Qué defiende el concepto de diversidad sexual?", "o": ["Que la única forma correcta de vivir la sexualidad es la heterosexual", "Que la sexualidad es un asunto privado del que no debe hablarse en la escuela", "Que no hay una única manera de vivir la sexualidad, independiente del sexo y del género", "Que la orientación sexual depende de la educación recibida en la familia"], "c": 2}, {"b": "8. Hábitos saludables", "q": "¿Qué se recomienda a quienes no suelen hacer ningún ejercicio físico?", "o": ["No hacer deporte, porque solo conviene a quienes ya están en forma", "Empezar con un entrenamiento intenso para ver resultados cuanto antes", "Hacer ejercicio solo los fines de semana para no cansarse entre semana", "Comenzar de forma lenta y progresiva, con pequeños incrementos"], "c": 3}];

function gR(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch{return[]}}
function sR(e){try{const r=gR();r.push(e);localStorage.setItem(STORAGE_KEY,JSON.stringify(r))}catch{}}
function gD(){try{return JSON.parse(localStorage.getItem(DONE_KEY)||'[]')}catch{return[]}}
function sD(m){try{const d=gD();d.push(m);localStorage.setItem(DONE_KEY,JSON.stringify(d))}catch{}}
function norm(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

let stu={name:'',email:'',curso:''},cur=0,ans=[],sel=null,running=false;
const ct=document.getElementById('content');
window.addEventListener('beforeunload',e=>{if(running){e.preventDefault();e.returnValue=''}});

function showLogin(m){m=m||'alumno';ct.innerHTML=`<div class="login-screen"><h2>${m==='alumno'?'Identificación del alumno/a':'Acceso del profesor'}</h2><p>${m==='alumno'?'Introduce tus datos y la contraseña del examen.':'Introduce la contraseña.'}</p><div class="login-box"><div class="login-toggle"><button class="toggle-btn ${m==='alumno'?'active':''}" onclick="showLogin('alumno')">Alumno/a</button><button class="toggle-btn ${m==='profesor'?'active':''}" onclick="showLogin('profesor')">Profesor</button></div><div id="lf">${m==='alumno'?sF():tF()}</div></div></div>`;const f=document.querySelector('#lf input');if(f)setTimeout(()=>f.focus(),80)}

function sF(){return`<div class="rules"><strong>${Q.length} preguntas</strong> con 4 opciones y una sola correcta.<br>Cada <strong>3 respuestas erróneas restan 1 acierto</strong>. Las preguntas en blanco no restan.<br>No podrás volver atrás. Al terminar solo verás tu nota final.</div><div class="field"><label>Nombre completo</label><input type="text" id="in" placeholder="Ej: María López García"><div class="error-msg" id="en">Introduce tu nombre</div></div><div class="field"><label>Correo corporativo</label><input type="email" id="ie" placeholder="tucorreo@murciaeduca.es"><div class="hint">@murciaeduca.es · @alu.murciaeduca.es · @alu365.murciaeduca.es</div><div class="error-msg" id="ee">Correo no válido</div></div><div class="field"><label>Curso</label><select id="ic"><option value="">— Selecciona —</option><option>2º ESO A</option><option>2º ESO B</option><option>2º ESO C</option><option>2º ESO D</option><option>2º ESO E</option></select><div class="error-msg" id="ec">Selecciona curso</div></div><div class="field"><label>Contraseña del examen</label><input type="password" id="ix" placeholder="La que te dé el profesor"><div class="error-msg" id="ex">Contraseña incorrecta</div></div><div class="error-msg" id="ed" style="margin-bottom:.6rem">Ya has realizado este examen en este dispositivo.</div><button class="login-btn" onclick="doSL()">Comenzar el examen →</button>`}
function tF(){return`<div class="field"><label>Contraseña</label><input type="password" id="ip" placeholder="Contraseña" onkeydown="if(event.key==='Enter')doTL()"><div class="error-msg" id="ep">Incorrecta</div></div><button class="login-btn" onclick="doTL()">Acceder →</button>`}

function doSL(){const g=id=>document.getElementById(id),n=g('in').value.trim(),e=g('ie').value.trim().toLowerCase(),c=g('ic').value,x=norm(g('ix').value);let v=1;
const chk=(ok,id)=>{g(id).style.display=ok?'none':'block';if(!ok)v=0};
chk(n.length>=3,'en');chk(/^[^\s@]+@(alu365\.|alu\.)?murciaeduca\.es$/.test(e),'ee');chk(!!c,'ec');chk(x===norm(EXAM_PASS),'ex');
if(!v)return;if(gD().includes(e)){g('ed').style.display='block';return}
stu={name:n,email:e,curso:c};cur=0;ans=[];running=true;showQ()}

function doTL(){norm(document.getElementById('ip').value)===norm(TEACHER_PASS)?showTP():document.getElementById('ep').style.display='block'}

function showQ(){
if(cur>=Q.length){finish();return}const q=Q[cur],pct=(cur/Q.length*100).toFixed(0);sel=null;
ct.innerHTML=`<div class="student-tag"><span class="dot"></span>${esc(stu.name)} · ${esc(stu.curso)}</div><div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div><div class="progress-info"><span>Pregunta ${cur+1}/${Q.length}</span><span>${esc(q.b)}</span></div><div class="question-card"><span class="q-type test">Tipo test</span><div class="q-text">${esc(q.q)}</div><div class="options">${q.o.map((o,i)=>`<button class="option-btn" onclick="pick(${i})"><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div><div class="nav-row"><button class="blank-btn" onclick="next(null)">Dejar en blanco</button><button class="go-btn" id="go" disabled onclick="next(sel)">${cur===Q.length-1?'Terminar el examen':'Siguiente →'}</button></div></div>`;window.scrollTo(0,0)}

function pick(i){sel=i;document.querySelectorAll('.option-btn').forEach((b,j)=>b.classList.toggle('selected',j===i));document.getElementById('go').disabled=false}
function next(v){if(cur===Q.length-1&&!confirm('¿Seguro que quieres terminar el examen y enviar tus respuestas?'))return;ans.push(v);cur++;showQ()}

async function sendGS(e){
if(!APPS_SCRIPT_URL||APPS_SCRIPT_URL.includes('PEGA_AQUI'))return'no-url';
try{await fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({fecha:e.date,nombre:e.name,curso:e.curso,correo:e.email,nota:e.nota,aciertos:e.ok,errores:e.ko,blanco:e.bl,netos:e.net,total:e.tp,porcentaje:e.pct,examen:EXAM_NAME,respuestas:e.resp})});return'ok'}catch{return'error'}}

async function finish(){
running=false;const tp=Q.length;let ok=0,ko=0,bl=0;
ans.forEach((a,i)=>{if(a===null)bl++;else if(a===Q[i].c)ok++;else ko++});
const net=Math.max(0,ok-Math.floor(ko/ERRORES_POR_PENALIZACION)),nota=Math.round(net/tp*1000)/100,pct=Math.round(net/tp*100);
const ds=new Date().toLocaleString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const resp=ans.map(a=>a===null?'-':'ABCD'[a]).join('');
const entry={name:stu.name,email:stu.email,curso:stu.curso,ok,ko,bl,net,tp,pct,nota,date:ds,resp};sR(entry);sD(stu.email);
const gc=nota>=5?'var(--correct)':'var(--wrong)';
ct.innerHTML=`<div class="results"><div class="student-tag"><span class="dot"></span>${esc(stu.name)} · ${esc(stu.curso)}</div><h2>Examen terminado</h2><div class="score-circle" style="border-color:${gc}"><span class="big" style="color:${gc}">${nota.toFixed(2).replace('.',',')}</span><span class="label">nota sobre 10</span></div><div id="ss" class="sync-status sync-pending">⏳ Enviando resultados...</div><p style="margin-top:1.2rem;font-size:.85rem;color:var(--text-muted)">Ya puedes cerrar esta ventana.</p></div>`;
const r=await sendGS(entry),ss=document.getElementById('ss');
if(r==='ok'){ss.className='sync-status sync-ok';ss.textContent='✓ Resultados enviados al profesor'}
else if(r==='no-url'){ss.className='sync-status sync-pending';ss.textContent='ℹ Guardado en este dispositivo (Google Sheets no configurado)'}
else{ss.className='sync-status sync-fail';ss.textContent='⚠ Error de envío. Avisa al profesor: queda guardado en este dispositivo.'}}

function showTP(){
const res=gR().sort((a,b)=>b.nota-a.nota||a.name.localeCompare(b.name));
let rows='';res.forEach((r,i)=>{rows+=`<tr><td class="rank-pos">${i+1}</td><td><strong>${esc(r.name)}</strong></td><td>${esc(r.curso)}</td><td>${esc(r.email)}</td><td class="rank-score">${r.nota}</td><td>${r.ok}</td><td>${r.ko}</td><td>${r.bl}</td><td>${r.net}/${r.tp}</td><td>${esc(r.date)}</td></tr>`});
if(!res.length)rows=`<tr><td colspan="10" style="text-align:center;padding:2rem;color:var(--text-muted)">Sin resultados en este dispositivo.<br>Los centralizados están en Google Sheets.</td></tr>`;
const key=Q.map(q=>'ABCD'[q.c]).join(' ');
ct.innerHTML=`<div class="ranking-section"><h3>Panel del profesor</h3><p style="text-align:center;font-size:.85rem;color:var(--text-muted);margin-bottom:1rem">${Q.length} preguntas · cada ${ERRORES_POR_PENALIZACION} errores restan 1 acierto · Nota = aciertos netos / ${Q.length} × 10.<br>Datos de este dispositivo; los centralizados están en tu <strong>Google Sheets</strong>.</p><div class="ranking-table-wrap"><table class="ranking-table"><thead><tr><th>#</th><th>Alumno/a</th><th>Curso</th><th>Correo</th><th>Nota</th><th>Aciertos</th><th>Errores</th><th>Blanco</th><th>Netos</th><th>Fecha</th></tr></thead><tbody>${rows}</tbody></table></div><div style="text-align:center">${res.length?`<button class="excel-btn" onclick="dlXL()">📊 Descargar Excel</button>`:''}<button class="excel-btn" onclick="if(confirm('¿Borrar los resultados y los bloqueos de este dispositivo?')){localStorage.removeItem(STORAGE_KEY);localStorage.removeItem(DONE_KEY);showTP()}" style="border-color:var(--wrong);color:var(--wrong);margin-left:.5rem">Borrar datos locales</button></div><details style="margin-top:1.2rem;font-size:.8rem;color:var(--text-muted)"><summary style="cursor:pointer">Plantilla de respuestas</summary><p style="margin-top:.5rem;word-spacing:.3rem">${key}</p></details><div style="text-align:center;margin-top:1rem"><button class="restart-btn" onclick="showLogin('alumno')">← Volver</button></div></div>`}

function dlXL(){
const res=gR().sort((a,b)=>b.nota-a.nota);
const d=[['Fecha','Nombre','Curso','Correo','Nota','Aciertos','Errores','En blanco','Aciertos netos','Total preguntas','Porcentaje','Examen','Respuestas']];
res.forEach(r=>d.push([r.date,r.name,r.curso,r.email,r.nota,r.ok,r.ko,r.bl,r.net,r.tp,r.pct,EXAM_NAME,r.resp]));
const wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(d);
ws['!cols']=[{wch:17},{wch:28},{wch:18},{wch:32},{wch:6},{wch:9},{wch:8},{wch:9},{wch:13},{wch:14},{wch:11},{wch:22},{wch:55}];
XLSX.utils.book_append_sheet(wb,ws,'Resultados');XLSX.writeFile(wb,'Resultados_Examen_Valores_U1.xlsx')}

showLogin('alumno');
</script>
</body>
</html>
